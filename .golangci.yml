version: "2"

linters:
  default: standard
  enable:
    - copyloopvar
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nolintlint
    - unconvert
    - unparam
  settings:
    errcheck:
      exclude-functions:
        # Closing a UDP socket has nothing useful to report.
        - (*net.conn).Close
    gosec:
      excludes:
        # The client and server read the SIP message files the user passes via -request/-response.
        - G304
        # Unhandled errors are already checked by errcheck.
        - G104
  exclusions:
    rules:
      # The integration test builds and runs the project's own binaries.
      - path: _test\.go
        linters:
          - gosec
        text: G204

formatters:
  enable:
    - gofmt
    - goimports
